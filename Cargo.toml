[package]
name = "chess_final"
version = "0.1.0"
edition = "2024"
default-run = "chess_final"

[dependencies]
eframe = "0.34.3"
num-format = "0.4"
rand = "0.10.2"
thousands = "0.2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
